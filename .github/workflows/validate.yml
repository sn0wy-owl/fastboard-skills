name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skills (Agent Skills spec)
        run: node scripts/validate-skills.mjs
      - name: Check installer works on a clean checkout
        run: node scripts/install.mjs --scope project --dry-run
