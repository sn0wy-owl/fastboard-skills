# Метаданные витрины для Codex CLI / ChatGPT (опционально, вне стандарта Agent Skills).
# Другие агенты этот файл игнорируют — он нужен только для красивого выбора скилла в UI.
interface:
  display_name: "Дашборд под ключ"
  short_description: "Бриф → HTML-предпросмотр → сборка страницы дашборда в BI"
  default_prompt: "Собери дашборд по брифу: сначала вопросы, затем HTML-предпросмотр в реальных координатах"
policy:
  allow_implicit_invocation: true
