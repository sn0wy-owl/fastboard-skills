# Метаданные витрины для Codex CLI / ChatGPT (опционально, вне стандарта Agent Skills).
# Другие агенты этот файл игнорируют — он нужен только для красивого выбора скилла в UI.
interface:
  display_name: "Стайлгайд дашборда"
  short_description: "Чистый нейтральный стиль: токены, нормализация настроек виджетов, чекер"
  default_prompt: "Сведи стиль дашборда к нейтральному: токены, нормализация настроек виджетов, проверка чекером"
policy:
  allow_implicit_invocation: true
